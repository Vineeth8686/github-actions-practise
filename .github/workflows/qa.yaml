name: Enterprise DevSecOps CICD Pipeline
on:
 push:
    branches:
      - qa
    paths:
      - client/**
      - server/**
      - .github/workflows/qa.yaml
jobs:
  gitleaks-scan:
    name: Gitleaks-scan
    runs-on: ubuntu-latest
    steps:
      - name: git checkout
        uses: actions/checkout@v4
      
      - name: Run Gitleaks Scan
        run: |
          docker run --rm \
            -v "${github.workspace}}":/repo \
            zricethezav/gitleaks:latest detech \
            --source=/repo \
            --report-format=json \
            --report-path=/repo/gitleaks-report.json \
            --redact \
            --exit-code 0
